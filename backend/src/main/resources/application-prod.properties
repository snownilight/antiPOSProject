spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:antipos}?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never

# CORS 跨域設定 (需由環境變數傳入)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# QR Code Self-Ordering Config (需由環境變數傳入)
app.frontend.url=${FRONTEND_URL}
