server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/antipos?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.project.backend.entity
mybatis.configuration.map-underscore-to-camel-case=true
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置 (POS-54 Security)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNhZmUta2V5LWZvci1qc29uLXdlYi10b2tlbi12YWxpZGF0aW9uLXNlY3VyZQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS 跨域設定：多個來源請用逗號分隔，例如：http://localhost:5173,https://your-domain.com
cors.allowed-origins=http://localhost:5173,http://192.168.1.107:5173

# QR Code Self-Ordering Config (POS-41)
app.frontend.url=http://192.168.1.107:5173
order.require-staff-confirm=true
